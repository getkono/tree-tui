name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v4
      - name: Format check
        run: mise run fmt-check
      - name: Clippy
        run: mise run lint
      - name: Test
        run: mise run test

  # The release workflow cross-compiles for four targets, but the job above only
  # ever builds for ubuntu-latest -- so a target-specific break stays invisible
  # until a release is already half-cut, which is how v0.2.0 shipped with zero
  # binary assets. Mirror the release matrix here to surface that class on a pull
  # request instead.
  #
  # Forward-looking, not a re-test of the v0.2.0 break: the target that actually
  # broke (x86_64-pc-windows-msvc) is no longer released, so it is not covered
  # here either. These four legs must also be added to the branch's required
  # status checks to actually block a merge.
  #
  # `check` rather than `build --release`: build scripts still run, so the cc-rs /
  # C-grammar failure class that actually broke us is caught, without paying for a
  # full LTO build on every PR. Link-time-only failures remain the release
  # workflow's `build --release` to catch.
  release-targets:
    name: Build check ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, use_cross: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, use_cross: true }
          - { os: macos-latest, target: x86_64-apple-darwin, use_cross: false }
          - { os: macos-latest, target: aarch64-apple-darwin, use_cross: false }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross
      - name: Check
        shell: bash
        run: |
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross check --release --target ${{ matrix.target }}
          else
            cargo check --release --target ${{ matrix.target }}
          fi

  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    # Only PRs carry an unmerged commit series worth linting; pushes to master are history.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # convco needs full history to walk the commit range
      # mise provisions convco (see mise.toml); the build is cached across runs.
      - uses: jdx/mise-action@v4
      - name: Conventional Commits check
        run: convco check ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
